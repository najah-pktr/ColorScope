<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="ring-cyan" x1="16" y1="12" x2="36" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ring-violet" x1="12" y1="14" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="ring-rose" x1="18" y1="20" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="reticle-glow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="10" fill="url(#bg-grad)" stroke="#222838" stroke-width="1.2"/>
  <circle cx="20" cy="22" r="8.5" stroke="url(#ring-violet)" stroke-width="2" fill="none" opacity="0.95"/>
  <circle cx="28" cy="22" r="8.5" stroke="url(#ring-cyan)" stroke-width="2" fill="none" opacity="0.95"/>
  <circle cx="24" cy="28.5" r="8.5" stroke="url(#ring-rose)" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- Central optical aperture reticle -->
  <circle cx="24" cy="24" r="2.75" fill="#FFFFFF" filter="url(#reticle-glow)"/>
</svg>
